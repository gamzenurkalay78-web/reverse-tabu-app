<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Reverse Tabu - Kart Tasarımı</title>
    <style>
        :root {
            --bg-color: #7FD1E0;
            --btn-color: #FF7E67;
            --accent-color: #2C8F9E;
            --card-bg: #FFFFFF;
            --text-dark: #1E2A2B;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        .game-screen {
            width: 380px;
            background: var(--bg-color);
            border-radius: 32px;
            padding: 20px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.1);
        }
        
        .score {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: white;
            margin-bottom: 24px;
        }
        
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            border: 4px solid var(--accent-color);
            padding: 60px 20px;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .card-word {
            font-size: 42px;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: 2px;
        }
        
        .button-group {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
        }
        
        .btn {
            flex: 1;
            background: var(--btn-color);
            border: none;
            border-radius: 48px;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }
        
        .btn-forbidden {
            background: var(--accent-color);
            width: 100%;
            border-radius: 32px;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            color: white;
            text-align: center;
            cursor: pointer;
        }
        
        .color-palette {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.3);
            display: flex;
            gap: 10px;
            font-size: 12px;
        }
        
        .color-chip {
            flex: 1;
            text-align: center;
            padding: 8px;
            border-radius: 16px;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="game-screen">
        <div class="score">⭐ 450 puan</div>
        
        <div class="card">
            <div class="card-word">SUNUCU</div>
        </div>
        
        <div class="button-group">
            <button class="btn">BİLDİM</button>
            <button class="btn">GEÇ</button>
        </div>
        
        <div class="btn-forbidden">⚠️ YASAKLI KELİMELER</div>
        
        <div class="color-palette">
            <div class="color-chip" style="background: #7FD1E0;">Aqua Breeze</div>
            <div class="color-chip" style="background: #FF7E67;">Coral Burst</div>
            <div class="color-chip" style="background: #2C8F9E;">Deep Lagoon</div>
        </div>
    </div>
</body>
</html>
